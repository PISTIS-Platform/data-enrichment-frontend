stages:
  - build
  - register

build-asset:
  stage: build
  image: node:16.14.2-buster-slim
  only:
    - main
  before_script:
    - corepack enable
    - corepack prepare pnpm@7.32.0 --activate  # Use pnpm 7.x for Node.js 16 compatibility
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - dist

register as latest:
  stage: register
  tags:
    - dind
  image: docker:latest
  variables:
    DOCKER_DRIVER: overlay2
  services:
    - docker:dind
  only:
    - main
  script:
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker build --pull -t "$CI_REGISTRY_IMAGE":latest .
    - docker push "$CI_REGISTRY_IMAGE":latest
